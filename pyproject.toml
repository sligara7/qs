[project]
name = "qs"
version = "0.1.0"
description = "Bluesky queue service: runs a SQL-backed queue of plans through one RunEngine, controlled over HTTP."
readme = "README.md"
requires-python = ">=3.11"
license = { text = "BSD-3-Clause" }
dependencies = [
    "bluesky>=1.13",
    "ophyd>=1.9",
    "ophyd-async>=0.10",
    "fastapi>=0.110",
    "uvicorn[standard]>=0.29",
    "sqlalchemy>=2.0",
    "pydantic>=2.6",
    "pyyaml>=6.0",
    "ipython>=8.0",
]

[project.optional-dependencies]
tiled = ["tiled[client]>=0.1", "bluesky-tiled-plugins>=2.0.0rc1"]
happi = ["happi>=2.0"]
dev = [
    "pytest>=8.0",
    "pytest-asyncio>=0.23",
    "httpx>=0.27",
    "websockets>=12",
    "ruff>=0.4",
    "mypy>=1.9",
]

[project.scripts]
qs = "qs.runtime.main:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/qs"]

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"

[tool.ruff]
line-length = 110
target-version = "py311"
exclude = ["tests/profiles"]  # profile fixtures contain IPython magics on purpose

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]

[tool.ruff.lint.flake8-bugbear]
extend-immutable-calls = ["fastapi.Depends", "fastapi.Body"]

[tool.ruff.lint.per-file-ignores]
"tests/*" = ["E501"]  # long literal payloads in tests are clearer on one line

[tool.mypy]
python_version = "3.11"
strict = true
ignore_missing_imports = true
