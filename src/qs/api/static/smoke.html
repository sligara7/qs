<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>qs smoke page</title>
<style>
  body { font: 14px system-ui, sans-serif; margin: 1.5rem; color: #222; }
  h1 { font-size: 1.2rem; }
  section { border: 1px solid #ccc; border-radius: 6px; padding: .75rem 1rem; margin-bottom: 1rem; }
  pre { background: #f5f5f5; padding: .5rem; overflow: auto; max-height: 14rem; }
  button { margin: .15rem; }
  input, select { margin: .15rem; }
  .row { display: flex; gap: 1rem; flex-wrap: wrap; }
  .row > section { flex: 1 1 22rem; }
  .err { color: #b00; }
</style>
</head>
<body>
<h1>qs smoke page <small>(development only; finch is the real frontend)</small></h1>
<section>
  API key: <input id="key" size="40" placeholder="QSERVER_HTTP_SERVER_SINGLE_USER_API_KEY"> <button onclick="connect()">Connect</button>
  <span id="conn"></span>
</section>
<div class="row">
<section>
  <h2>Status</h2>
  <pre id="status">—</pre>
</section>
<section>
  <h2>Queue</h2>
  <div>
    <button onclick="post('/api/queue/start')">Start</button>
    <button onclick="post('/api/queue/stop')">Stop</button>
    <button onclick="post('/api/queue/stop/cancel')">Cancel stop</button>
    <button onclick="post('/api/queue/autostart',{enable:true})">Autostart on</button>
    <button onclick="post('/api/queue/autostart',{enable:false})">Autostart off</button>
    <button onclick="post('/api/queue/clear')">Clear</button>
  </div>
  <div>
    Plan <select id="plan"></select>
    args (JSON) <input id="args" size="24" value='[["det"]]'>
    kwargs (JSON) <input id="kwargs" size="18" value='{"num": 3}'>
    <button onclick="addItem()">Add</button>
  </div>
  <pre id="queue">—</pre>
</section>
<section>
  <h2>Run engine</h2>
  <button onclick="post('/api/re/pause',{option:'immediate'})">Pause</button>
  <button onclick="post('/api/re/resume')">Resume</button>
  <button onclick="post('/api/re/abort')">Abort</button>
  <button onclick="post('/api/re/stop')">Stop</button>
  <button onclick="post('/api/re/halt')">Halt</button>
  <h3>Device progress (info/ws)</h3>
  <pre id="progress">—</pre>
</section>
<section>
  <h2>History</h2>
  <pre id="history">—</pre>
</section>
<section>
  <h2>Console</h2>
  <pre id="console">—</pre>
</section>
</div>
<pre id="log" class="err"></pre>
<script>
const $ = id => document.getElementById(id);
let key = '';
const hdrs = () => key ? {'Authorization': 'Apikey ' + key, 'Content-Type': 'application/json'} : {'Content-Type': 'application/json'};
async function get(path) { const r = await fetch(path, {headers: hdrs()}); return r.json(); }
async function post(path, body) {
  const r = await fetch(path, {method: 'POST', headers: hdrs(), body: JSON.stringify(body || {})});
  const j = await r.json(); if (!j.success) $('log').textContent = path + ': ' + j.msg; else $('log').textContent = '';
  refresh(); return j;
}
async function addItem() {
  try {
    await post('/api/queue/item/add', {item: {item_type: 'plan', name: $('plan').value, args: JSON.parse($('args').value), kwargs: JSON.parse($('kwargs').value)}});
  } catch (e) { $('log').textContent = e; }
}
async function refresh() {
  try {
    const q = await get('/api/queue/get');
    $('queue').textContent = (q.items || []).map(i => `${i.item_uid.slice(0,8)}  ${i.name}(${JSON.stringify(i.args)}, ${JSON.stringify(i.kwargs)})`).join('\n') || '(empty)';
    const h = await get('/api/history/get');
    $('history').textContent = (h.items || []).slice(-10).map(i => `${i.result.exit_status.padEnd(8)} ${i.name} ${i.result.msg || ''}`).join('\n') || '(empty)';
  } catch (e) { $('log').textContent = e; }
}
function ws(path, onmsg) {
  const url = (location.protocol === 'https:' ? 'wss://' : 'ws://') + location.host + path + (key ? '?api_key=' + encodeURIComponent(key) : '');
  const s = new WebSocket(url); s.onmessage = e => onmsg(JSON.parse(e.data)); s.onclose = e => $('conn').textContent += ` [${path} closed ${e.code}]`; return s;
}
async function connect() {
  key = $('key').value.trim();
  try {
    const p = await get('/api/plans/allowed');
    $('plan').innerHTML = Object.keys(p.plans_allowed || {}).map(n => `<option>${n}</option>`).join('');
    $('conn').textContent = 'connected';
  } catch (e) { $('conn').textContent = 'error: ' + e; return; }
  ws('/api/status/ws', s => { $('status').textContent = JSON.stringify({manager_state: s.manager_state, re_state: s.re_state, items_in_queue: s.items_in_queue, running_item_uid: s.running_item_uid, queue_stop_pending: s.queue_stop_pending, autostart: s.queue_autostart_enabled, last_error: s.qs && s.qs.last_error}, null, 1); refresh(); });
  ws('/api/info/ws', m => { if (m.msg.device_progress) { const d = m.msg.device_progress; $('progress').textContent = d.completed ? 'completed' : `${d.name}: ${d.current} → ${d.target} (${Math.round((d.fraction||0)*100)}%)`; } });
  ws('/api/console_output/ws', m => { const el = $('console'); el.textContent = (el.textContent + m.msg).split('\n').slice(-30).join('\n'); });
  refresh();
}
</script>
</body>
</html>
