name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    name: lint + tests (no beamline)
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Install
        run: uv sync --extra dev
      - name: Lint
        run: |
          uv run ruff check src tests tools/hextools-sim-profile
          uv run ruff format --check src tests tools/hextools-sim-profile
      - name: Install a browser for the smoke-page test
        run: uv run playwright install --with-deps chromium
      - name: Tests
        # Acceptance tests skip themselves without QS_HEX_SIM_URL; UI tests skip without a browser.
        run: uv run pytest -q
